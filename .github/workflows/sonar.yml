# The SonarCloud issue gate (Q-R64). A bundled part holds no code a scan reads.
name: sonar
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@db6f9a3b22295cac26a088a2f84e9cc5ca4b9b0d # v1.0.91
    with:
      allowed-open: 0
      code: false
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
